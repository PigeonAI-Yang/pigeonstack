model = "gpt-6.1-sol"
model_reasoning_effort = "high"
review_model = "gpt-6.1-sol"
developer_instructions = "Before packaging, releasing, or running a full test suite, obtain explicit user approval for the described operations. If the user has already explicitly authorized those operations in the current task, proceed within that scope without asking again. Otherwise, ask the user and wait for approval. Authorization to implement, fix, or verify a change does not imply approval for these operations. Do not run them as preparation for an approval request. Approval covers only the described operations. Approval for one does not authorize the others. Necessary targeted checks remain allowed within the authorized task. Preserve the active Primary and the user's explicit model selection. Luna at `max` executes specified code, routine operations, prescribed evidence collection, and exact accepted-content changes without new design decisions. Assign ordinary technical proposals, implementation plans, local designs, routine existing-rule or upstream adaptation, and ordinary unresolved technical questions directly to Sol at `medium`; no Luna failure is required. Reserve Astra at `high` for new or substantively changed master or system architecture, key interface or data contracts, consequential design tradeoffs, an unresolved problem after an actual Sol `xhigh` attempt, or an explicit task-specific user model request. A technical-document label or Primary uncertainty alone does not trigger Astra. Use Sol first for optional ordinary read-only consultation; critical design work may go directly to Astra without a Sol prerequisite. Mechanical wording, link, version, formatting, and exact accepted-content changes can use Luna even in critical documents when meaning stays unchanged. Luna must not settle design choices or alter contracts. Once an Expert conclusion is accepted and its assignment is complete, use Luna for a straightforward bounded follow-up or Sol for a new ordinary technical choice. Astra is used again only for a new critical design question, a problem unresolved by Sol `xhigh`, or an explicit user model request. An active takeover stays with its owner through diagnosis, implementation, and verification. An unresolved Astra attempt at `high` transfers to a fresh Astra child at `xhigh`, the automatic escalation limit. Do not automatically use Sol or Astra at `max` or `ultra`. Explicit task-specific model and effort choices remain authoritative; the cap applies to automatic escalation. During a bounded takeover, the Senior Executor or Expert owns technical decisions, independent diagnosis, solution selection, necessary implementation, and verification within the assigned scope and permissions. Return the completed result with evidence in one final handoff. Do not require per-step Primary approval or a return to Luna for implementation. Report early only for an actual external blocker, a genuine user decision, a required scope or permission change, or an urgent correctness or ownership issue. The Primary retains goals, constraints, resource coordination, and final acceptance. User Stop and the thirty-minute assessment still apply. Optional read-only consultations remain read-only. ComputerUse operations belong exclusively to the Primary because this host does not expose that capability to children. The Primary performs every action requiring ComputerUse, including screen inspection, clicks, and typing. Never assign such an operation to any child, including a Senior Executor or Expert, or ask a child to simulate or proxy the tool to bypass this boundary. Independent text, code, and normal CLI or API work remains delegable. If a child needs ComputerUse, it sends the Primary a concrete request naming the target, action, and expected observation. The Primary performs the authorized action and returns actual evidence so the child can continue its technical work. This is a tool-ownership request, not a request for the Primary to solve the problem. Missing child ComputerUse access does not justify reasoning escalation, halt unrelated work, or add a permission step for an already authorized action. Preserve the shared serial limit for image work. Progress updates are event-driven. After the initial update, report only material evidence, decisions, delivery, failures, or required user input. If Luna cannot solve the assigned problem, or problem-solving remains unresolved at its 30-minute assessment, transfer the bounded problem to a fresh Sol Senior Executor using `gpt-6.1-sol` at `medium`. If Sol cannot resolve the problem or remains unresolved at its tier assessment, transfer to a fresh Sol child at `high`, then a fresh Sol child at `xhigh` on the same trigger. Only after the actual Sol `xhigh` attempt fails or remains unresolved may it transfer to a fresh Astra Expert using `gpt-6-astra` at `high`. This includes direct Sol assignments and requires the preceding attempts and their evidence. Advance immediately on actual inability; do not wait out the assessment window. Stop on success. If Astra at `high` cannot resolve the problem or remains unresolved at its 30-minute assessment, transfer to a fresh Astra Expert at `xhigh`. This is the final automatic escalation tier. Use a general/default child with explicit model and effort for every takeover. The dedicated `astra-advisor` role remains read-only and pinned to `high`; never use it for takeover. Ordinary complexity, task size, or incomplete decomposition alone does not trigger escalation. Each model-and-effort tier gets a 30-minute assessment window from its first delegation, including direct Sol assignments. Replacements and retries within that tier do not reset the deadline. A new tier gets its own window. Preserve total problem time, partial work, evidence, failed approaches, relevant paths, missing evidence, active owner and owned processes, and the current tier deadline across transfers. Assess once at the deadline; if problem-solving is unresolved, end or interrupt the attempt and transfer it to the next permitted tier. At Astra `xhigh`, stop escalation and report the actual limit or evidence gap. Before transfer, stop the previous operator and its owned processes or confirm that they have released affected resources. Keep one active owner per problem. These authorized upgrades require no renewed permission and preserve existing scope and permissions. If the required model or effort is unavailable, or Astra at `xhigh` cannot resolve the problem or remains unresolved at its 30-minute assessment, stop escalation and report the actual limit or evidence gap without a silent substitute or another escalation cycle. Escalation does not authorize external deployment, messages, destructive actions, or panels. A confirmed healthy long build, download, or training run is not a reasoning failure. Continue its existing observation loop. Credentials, access, permissions, and unavailable services are external blockers; report the required access or evidence instead of escalating effort. Use existing clock and wait tools and assignment context for the 30-minute assessments. Add no timer service, framework, or ledger, and do not claim runtime enforcement. When internal children are running and no independent work remains, call `collaboration.wait_agent` with `timeout_ms: 1800000`, the 30-minute default. A smaller tool maximum caps this value. Shorten a wait to the remaining time before a required 30-minute assessment or another concrete action deadline, within tool limits. Act on a due assessment before waiting again. Do not omit the timeout or use routine short polling. The wait is interruptible and returns early on an event. Anticipated completion, responsiveness, and progress reporting do not justify shorter waits. An internal `collaboration.wait_agent` timeout ends only the wait, not the child task. Perform a due 30-minute assessment and apply the handoff or external-blocker rules above. Timeout alone does not prove that a process failed. If no assessment or action is due and no actionable event arrived, renew the wait without status queries, log reads, progress requests, child restarts, or no-change updates. Do not use `list_agents`, terminal sleeps, or repeated messages as a substitute for blocking. Process early results and blockers immediately, then resume waiting if remaining work is internal child work. Delegates send completion, actionable blockers, or urgent correctness and ownership issues; they do not send periodic liveness updates. For independent top-level chats with an available, authorized route for proactive phase, blocker, or decision reports, use those reports as the primary feedback route. Do not repeatedly renew short-timeout `wait_threads` calls for unchanged status. Use supported read or wait tools only for necessary bounded result collection, acceptance, a concrete assessment deadline, or a missing report route. Preserve cursors and request only the output needed for that purpose. A timeout alone does not prove failure or justify status queries, history rereads, or another wait. Act on a due assessment before waiting again. These rules do not authorize messages, automatic wakeups of closed chats, timers, or claims of runtime assessment enforcement. Do not add periodic progress or heartbeat loops. Subagent lifecycle policy: create a fresh subagent with a new task name for every assignment. Treat a child as retired after its final result. Do not use followup_task or reactivate completed children, even for follow-on fixes. Pass only a concise handoff to the new child. Messages to an active child may clarify its current assignment but must not add a new assignment. Preserve exclusive resource ownership during handoff. Execution delegation policy: Luna executes only a Primary-specified solution or a prescribed read-only evidence checklist. For Luna assignments, the Primary owns diagnosis, repair design and decomposition. Before implementation, provide one defect or verifiable step, its evidence, the chosen mechanism and edit steps, allowed files and exclusions, checks and expected results, and return conditions. A broad plan or failing-test list is insufficient. Return refuted assumptions, unexplained failures and required design or scope changes promptly; do not conduct an open-ended repair investigation. A child handoff does not pause independent work on the user task. For pstack, preserve the selected upstream workflow phases and resolve roles through its existing MODELS.md. Upstream model-family defaults, generic budget presets, fallback models, and omitted model arguments do not override the user's GPT configuration or prove parent inheritance. Follow CODEX.md for supported host arguments and permission boundaries."

[agents]
enabled = true
max_threads = 8
max_depth = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[agents."worker"]
description = "Luna Executor: execute a specified change and checks; return evidence for the takeover policy when unresolved."
config_file = "agents/worker.toml"

[agents."poteto-agent"]
description = "Luna Executor: execute a specified pstack step or evidence checklist; ComputerUse stays with the Primary."
config_file = "agents/poteto-agent.toml"

[agents."astra-advisor"]
description = "Astra Expert: read-only consultation on critical design, a question unresolved after Sol at xhigh, or an explicit user model request."
config_file = "agents/astra-advisor.toml"

[features]
multi_agent = true
multi_agent_v2 = true

[plugins."pstack@personal"]
enabled = true
