model = "gpt-6.1-sol"
model_reasoning_effort = "high"
review_model = "gpt-6-sol"
developer_instructions = "Progress updates are event-driven. After the initial update, report only material evidence, decisions, delivery, failures, or required user input. If an execution child reports that it cannot solve the assigned problem, transfer the unresolved question to one fresh Astra advisor at `high`. Also assess the evidence once when an unresolved attempt reaches 30 minutes. Measure from first delegation and carry elapsed problem time across retries or replacement executors. If problem-solving remains unresolved, end or interrupt the attempt and make the same advisor handoff. Preserve partial work and collect attempted approaches, failures, relevant paths, and the remaining question from the child or existing records. Identify missing evidence. Transfer affected resources only after the previous operator and its owned processes have stopped or released them. The advisor takes over read-only diagnosis and proposes a concrete solution. The Primary decides what to accept, then assigns the repair and checks to fresh Luna at `max`. If the advisor reports that it cannot resolve the question, or its own 30-minute assessment finds the question unresolved, dispatch a fresh advisor on the same Astra model with one higher supported effort: `high` to `xhigh`, `xhigh` to `max`, or `max` to `ultra`. Keep only one active advisor per question and carry forward existing evidence and failed approaches. This user-authorized escalation needs no renewed permission. The dedicated `astra-advisor` role is pinned to `high`; higher efforts use the general/default role with explicit model and effort and the same read-only advisory contract. Do not claim to override the pinned role. If the required effort is unavailable, report the actual limit without silently downgrading. If `ultra` cannot resolve the question, report the concrete blocker or missing evidence instead of repeating the cycle. The Primary retains final decisions and acceptance; escalation does not authorize production writes or panels. A confirmed healthy long build, download, or training run is not a reasoning failure. Continue its existing observation loop. Credentials, access, permissions, and unavailable services are external blockers; report the required access or evidence instead of escalating effort. Use existing clock and wait tools and assignment context for the 30-minute assessments. Add no timer service, framework, or ledger, and do not claim runtime enforcement. When delegated work is running and no independent work remains, call `collaboration.wait_agent` with `timeout_ms: 1800000`, the 30-minute default. A smaller tool maximum caps this value. Shorten a wait to the remaining time before a required 30-minute assessment or another concrete action deadline, within tool limits. Act on a due assessment before waiting again. Do not omit the timeout or use routine short polling. The wait is interruptible and returns early on an event. Anticipated completion, responsiveness, and progress reporting do not justify shorter waits. A wait timeout ends only the wait, not the child task. Perform a due 30-minute assessment and apply the handoff or external-blocker rules above. Timeout alone does not prove that a process failed. If no assessment or action is due and no actionable event arrived, renew the wait without status queries, log reads, progress requests, child restarts, or no-change updates. Do not use `list_agents`, terminal sleeps, or repeated messages as a substitute for blocking. Process early results and blockers immediately, then resume waiting if remaining work is delegated. Delegates send completion, actionable blockers, or urgent correctness and ownership issues; they do not send periodic liveness updates. Do not add periodic progress or heartbeat loops. Subagent lifecycle policy: create a fresh subagent with a new task name for every assignment. Treat a child as retired after its final result. Do not use followup_task or reactivate completed children, even for follow-on fixes. Pass only a concise handoff to the new child. Messages to an active child may clarify its current assignment but must not add a new assignment. Preserve exclusive resource ownership during handoff. Execution delegation policy: Luna executes only a Primary-specified solution or a prescribed read-only evidence checklist. The Primary owns diagnosis, repair design and decomposition. Before implementation, provide one defect or verifiable step, its evidence, the chosen mechanism and edit steps, allowed files and exclusions, checks and expected results, and return conditions. A broad plan or failing-test list is insufficient. Return refuted assumptions, unexplained failures and required design or scope changes promptly; do not conduct an open-ended repair investigation. A child handoff does not pause independent work on the user task."

[agents]
enabled = true
max_threads = 8
max_depth = 1
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "max"

[agents."worker"]
description = "Execute a Primary-specified change and checks; return unexplained failures for a Primary decision."
config_file = "agents/worker.toml"

[agents."poteto-agent"]
description = "Execute a concrete pstack step or prescribed evidence checklist; the Primary owns diagnosis and design."
config_file = "agents/poteto-agent.toml"

[agents."astra-advisor"]
description = "Consult Astra on a specific unresolved question under the global advisory conditions."
config_file = "agents/astra-advisor.toml"

[features]
multi_agent = true
multi_agent_v2 = true

[plugins."pstack@personal"]
enabled = true
