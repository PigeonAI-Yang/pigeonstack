model = "gpt-6-astra"
model_reasoning_effort = "high"
review_model = "gpt-6.1-sol"
developer_instructions = "Follow the current global AGENTS.md already supplied by the host. It owns authorization, direct execution, ownership, verification, communication, and source/deployment boundaries. Use the applicable pstack CODEX.md only for a concrete workflow or host-tool need. Load MULTI_AGENT.md and MODELS.md only for explicitly authorized delegation or actual model configuration. Preserve the active model and effort. References and skills do not expand human authorization."

[agents]
enabled = true
max_threads = 8
max_depth = 1
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[agents."worker"]
description = "Sol Executor: own ordinary diagnosis, implementation, and verification within the assigned scope."
config_file = "agents/worker.toml"

[agents."poteto-agent"]
description = "Luna Mechanical Executor: perform only simple repetitive work with fixed steps and checkable results; ComputerUse stays with the Primary."
config_file = "agents/poteto-agent.toml"

[agents."astra-advisor"]
description = "Astra Expert: read-only consultation on critical design, a question unresolved after Sol at xhigh, or an explicit user model request."
config_file = "agents/astra-advisor.toml"

[features]
multi_agent = true
multi_agent_v2 = true

[plugins."pstack@personal"]
enabled = true
